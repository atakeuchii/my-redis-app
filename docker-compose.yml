services:
  postgres:
    image: postgres:16
    container_name: pg-game
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game
    ports:
      - "5437:5432"
    volumes:
      - pg-game-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pg-game-data:
